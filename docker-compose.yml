services:
  api:
    build: ./api
    environment:
      PORT: 3001
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"

  web:
    build:
      context: ./web
      args:
        # The browser calls the API directly, so this is the host-mapped URL.
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api
